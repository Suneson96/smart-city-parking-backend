services:
  db:
    image: postgis/postgis:17-3.5
    container_name: smart-city-parking-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  web:
    build: .
    container_name: smart-city-parking-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
        restart: true

  predict:
    build:
      context: .
      dockerfile: prediction_service/Dockerfile
    container_name: smart-city-parking-predict
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      
volumes:
  postgres_data:
