services:
  web:
    build: .
    container_name: smart-parking-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:17
    container_name: smart-parking-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
volumes:
  postgres_data: